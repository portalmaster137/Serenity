# ============================================
# SerenityOS Installer Configuration
# ============================================
# Default values for the interactive installer.
# These can be overridden by the interactive prompts.
# ============================================

# Host configuration to use: usb, hades, or template
HOST="usb"

# Disk to install to (e.g., /dev/sda, /dev/nvme0n1)
DISK="/dev/sda"

# Partition scheme: "ext4" or "zfs"
FILESYSTEM="ext4"

# Enable encryption? (true/false)
# For ZFS: uses ZFS native encryption
# For Ext4: uses LUKS
ENCRYPT=true

# System hostname
HOSTNAME="serenity-os"

# User settings
USERNAME="serenity"
PASSWORD="password"

# Git settings
GIT_USER="serenity-F"
GIT_EMAIL="serenity-F@noreply.codeberg.org"

# Locale and timezone
LOCALE="en_AU.UTF-8"
TIMEZONE="Australia/Brisbane"

# GPU support (auto-detected, but can be overridden)
# Set to "true" to force enable, "false" to force disable
ENABLE_NVIDIA=""
ENABLE_AMD=""

# Feature flags (for desktop installs)
ENABLE_GAMING=true
ENABLE_MEDIA_SERVER=false
ENABLE_VR=false
ENABLE_MUSIC=false
ENABLE_BLUETOOTH=true
